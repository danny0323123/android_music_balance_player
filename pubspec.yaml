name: music_balance
description: "Music player with per-song loudness normalization."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  rxdart: ^0.28.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.6
  permission_handler: 12.0.1
  flutter_riverpod: ^3.4.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  balance_native:
    path: packages/balance_native
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  generate: true
  uses-material-design: true
