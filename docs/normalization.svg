<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif">
  <rect width="760" height="330" rx="12" fill="#ffffff"/>
  <g font-size="18" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="190" y="34">原本：每首歌大小聲不一</text>
    <text x="570" y="34">均衡後：每首聽起來一樣大聲</text>
  </g>
  <!-- 目標線 -->
  <g stroke="#e8590c" stroke-width="2" stroke-dasharray="6 5">
    <line x1="30" y1="150" x2="350" y2="150"/>
    <line x1="410" y1="150" x2="730" y2="150"/>
  </g>
  <text x="380" y="155" font-size="13" fill="#e8590c" text-anchor="middle">目標</text>
  <!-- 原本 -->
  <g fill="#4c6ef5">
    <rect x="50" y="70" width="44" height="210"/>
    <rect x="110" y="190" width="44" height="90"/>
    <rect x="170" y="100" width="44" height="180"/>
    <rect x="230" y="215" width="44" height="65"/>
    <rect x="290" y="130" width="44" height="150"/>
  </g>
  <!-- 均衡後 -->
  <g fill="#37b24d">
    <rect x="430" y="150" width="44" height="130"/>
    <rect x="490" y="150" width="44" height="130"/>
    <rect x="550" y="150" width="44" height="130"/>
    <rect x="610" y="150" width="44" height="130"/>
    <rect x="670" y="150" width="44" height="130"/>
  </g>
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="72" y="300">A</text><text x="132" y="300">B</text><text x="192" y="300">C</text><text x="252" y="300">D</text><text x="312" y="300">E</text>
    <text x="452" y="300">−6 dB</text><text x="512" y="300">+5 dB</text><text x="572" y="300">−3 dB</text><text x="632" y="300">+7 dB</text><text x="692" y="300">−1 dB</text>
  </g>
  <text x="380" y="322" font-size="13" fill="#777" text-anchor="middle">app 先量出每首歌的響度，播放時自動調大或調小；整體音量仍由手機音量鍵控制</text>
</svg>
